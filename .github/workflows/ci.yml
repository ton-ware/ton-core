name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Linux Clang (${{ matrix.preset }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        preset: [ debug, dev, dist ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: Configure (${{ matrix.preset }})
        run: cmake --preset ${{ matrix.preset }}

      - name: Build (${{ matrix.preset }})
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Tests (${{ matrix.preset }})
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
